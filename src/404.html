<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Digital Editions</title>
    <script type="text/javascript">
      // GitHub Pages serves this for any unknown path. Redirect to index.html, carrying the path in the
      // query string; the script in index.html restores it. https://github.com/rafgraph/spa-github-pages
      // pathSegmentsToKeep = 0 because the site is served from the domain root (see <base href> in index.html).
      var pathSegmentsToKeep = 0;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
